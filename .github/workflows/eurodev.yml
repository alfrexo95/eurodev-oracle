name: EuroDev Oracle Runner

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EuroDev Oracle Action
        uses: alfrexo95/eurodev-oracle-action@v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          crypto-address-eth: ${{ secrets.CRYPTO_ADDRESS_ETH }}
          crypto-address-btc: ${{ secrets.CRYPTO_ADDRESS_BTC }}
          pat-token: ${{ secrets.PAT_TOKEN }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login || github.event.comment.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
