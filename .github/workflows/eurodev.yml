name: EuroDev Oracle Runner

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (interact or hunt)'
        required: false
        default: 'interact'

permissions:
  issues: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for advanced scan)
        uses: actions/checkout@v4

      - name: Run EuroDev Oracle Action
        uses: alfrexo95/eurodev-oracle-action@v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          crypto-address-eth: ${{ secrets.CRYPTO_ADDRESS_ETH }}
          pat-token: ${{ secrets.PAT_TOKEN }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login || github.event.comment.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'interact' }}
